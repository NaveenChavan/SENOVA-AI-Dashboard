[pytest]
# Tests import the app as ``app.*``, so the backend directory must be on the
# path. ``testpaths`` keeps a bare ``pytest`` run scoped to the suite.
pythonpath = .
testpaths = tests
addopts = -q

# ``auto`` so a test for an async function can be written as a plain
# ``async def test_*`` without an explicit marker. Only the Tier 2 Gemini tests
# are async; every other test in the suite is synchronous and unaffected.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
